<!DOCTYPE html>
<html>
<head>
    <title>Playback Speed Control</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            text-align: center;
            color: white;
            background: url('penguin.png') no-repeat center center fixed;
            background-size: cover;
            width: 400px; /* Adjusted width */
            height: 300px; /* Adjusted height */
            box-sizing: border-box;
        }
        h3 {
            margin-bottom: 20px;
        }
        #speedSlider {
            width: 80%;
            margin: 20px 0;
        }
        #speedValue {
            font-size: 18px;
            font-weight: bold;
        }
        footer {
            position: fixed;
            bottom: 10px;
            width: 100%;
            text-align: center;
            font-size: 12px;
            color: #e6e6e6;
        }
    </style>
</head>
<body>
    <h3>Adjust Playback Speed</h3>
    <input type="range" id="speedSlider" min="0.1" max="16" step="0.1" value="1">
    <span id="speedValue">1.0x</span>

    <footer>Copyright reserved 2025 Made with heart by PenguinCre8te</footer>
    
    <script src="popup.js"></script>
</body>
</html>
